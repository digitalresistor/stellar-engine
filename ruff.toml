# Repository-wide Ruff settings that follow the Google Python Style Guide.
# Self-contained Python projects can extend this file with stricter rules.

line-length = 80
indent-width = 4
target-version = "py311"
extend-exclude = [
  "*.ipynb",
  ".terraform",
  ".venv",
  "venv",
  "node_modules",
]

[format]

[lint]
select = ["E", "W", "F", "I"]

[lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["typing", "collections.abc"]
